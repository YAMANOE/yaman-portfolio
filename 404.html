<!-- The CSS here is INLINE on purpose. Do not replace it with a link to
     assets/styles.css.

     GitHub Pages serves this file for ANY unmatched path, but the browser
     resolves relative URLs against the REQUESTED path. A visitor hitting
     /yaman-portfolio/a/b/c would resolve "assets/styles.css" to
     /yaman-portfolio/a/b/assets/styles.css and get an unstyled page.
     AGENTS.md forbids root-absolute paths, so inlining is the fix. -->
<style>
  :root {
    --paper: #F7F6F2; --paper-lift: #FEFEFC;
    --ink: #14161A; --ink-2: #4A4F57; --ink-3: #565C66;
    --mint: #0B6B53; --mint-glow: #D6F5EA;
    --line: #D2CFC7; --line-soft: #E4E2DB;
    --gutter: 1.5rem; --radius: 0.5rem; --cell: 24px; --arterial: calc(var(--cell) * 4);
    --shell: calc(var(--arterial) * 12);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; flex-direction: column; font-size: 1rem; line-height: 1.65; color: var(--ink);
    font-family: "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(to right,  var(--line)      1px, transparent 1px),
      linear-gradient(to right,  var(--line-soft) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
    background-size: var(--arterial) 100%, var(--cell) 100%, 100% var(--cell);
  }
  .shell { width: 100%; max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); }
  .skip {
    position: absolute; left: var(--gutter); top: -4rem; z-index: 10;
    padding: 0.6rem 1rem; background: var(--paper-lift); border: 1px solid var(--mint);
    border-radius: var(--radius); font-size: 0.8125rem; text-decoration: none;
    font-family: "JetBrains Mono", ui-monospace, monospace; transition: top 160ms ease;
  }
  .skip:focus { top: 0.75rem; }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; border-radius: 2px; }
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--paper-lift); border-bottom: 1px solid var(--line); }
  .topbar__inner { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; min-height: 3.5rem; padding-block: 0.6rem; }
  .mark { font-weight: 700; font-size: 1.0625rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em;
          font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; }
  .nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-inline-start: auto; }
  .nav a { font-size: 0.8125rem; color: var(--ink-2); text-decoration: none; padding-block: 0.25rem;
           font-family: "JetBrains Mono", ui-monospace, monospace; border-bottom: 1px solid transparent; }
  .nav a:hover { color: var(--mint); border-bottom-color: var(--mint); }
  .pill { font-size: 0.6875rem; letter-spacing: 0.04em; color: var(--ink-2); background: var(--mint-glow);
          border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.6rem; white-space: nowrap;
          font-family: "JetBrains Mono", ui-monospace, monospace; }
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 0.75rem;
             font-family: "JetBrains Mono", ui-monospace, monospace; }
  h1 { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
       font-weight: 600; line-height: 1.2; margin: 0 0 0.75rem; font-size: clamp(1.75rem, 5vw, 2.5rem); }
  main { flex: 1; }
  .lost { padding-block: 5rem 6rem; }
  .lost p { color: var(--ink-2); max-width: 46ch; margin: 0 0 1.5rem; }
  .site-footer { margin-top: 4rem; border-top: 1px solid var(--line); background: var(--paper-lift); }
  .site-footer__inner { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; justify-content: space-between;
                        padding-block: 1.5rem; font-size: 0.8125rem; color: var(--ink-2);
                        font-family: "JetBrains Mono", ui-monospace, monospace; }
  a { color: var(--mint); }
  /* matches the steps in styles.css — see the note there */
  @media (min-width: 1680px) { :root { --arterial: calc(var(--cell) * 5); } }
  @media (min-width: 2016px) { :root { --arterial: calc(var(--cell) * 6); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>

<main id="main">
  <div class="shell lost">
    <p class="eyebrow">404</p>
    <h1>That page does not exist.</h1>
    <p>The link may be out of date, or the address mistyped.</p>
    <p><a href="./">Go to the home page</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="shell site-footer__inner">
    <span>AI/ML Engineer — civic tech, computer vision, multi-agent systems.</span>
    <span>Amman, Jordan</span>
  </div>
</footer>

<!-- Pages serves this file for any unmatched path, so "./" can resolve to a
     directory that does not exist (a hit on /yaman-portfolio/a/b/c). This
     rewrites the two home links to the real repo root.
     ponytail: assumes the site lives one segment below the host, which is
     true for a project Pages site. With JS off, "./" is still correct for the
     common case of a mistyped top-level page. -->
<script>
  (function () {
    var root = '/' + location.pathname.split('/')[1] + '/';
    document.querySelectorAll('a[href^="./"]').forEach(function (a) {
      a.href = root + a.getAttribute('href').slice(2);
    });
  })();
</script>

</body>
