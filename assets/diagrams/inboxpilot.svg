<svg xmlns="http://www.w3.org/2000/svg" class="dg dg--lane" viewBox="0 0 720 200" role="img" aria-label="Chat, DM and voice channels feed a unified inbox through sandbox adapters. The inbox feeds an AI layer doing intent, sentiment and retrieval over company knowledge, which produces either a suggested Arabic reply or a ticket for human review." focusable="false"><style>
  .dg__box  { fill: none; stroke: #D2CFC7; stroke-width: 1; }
  .dg__box--sig { stroke: #0B6B53; stroke-width: 1.5; }
  .dg__line { fill: none; stroke: #D2CFC7; stroke-width: 1; }
  .dg__head { fill: #D2CFC7; stroke: none; }
  .dg__t    { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; fill: #4A4F57; }
  .dg__t--sig { fill: #0B6B53; }
  .dg__lane { fill: #565C66; font-size: 10px; }
</style>
<g class="dg__flow">
  <text class="dg__t dg__lane" x="52" y="50" text-anchor="middle">Channels</text>
  <text class="dg__t dg__lane" x="52" y="150" text-anchor="middle">Output</text>

  <rect class="dg__box" x="112" y="24" width="124" height="52"/>
  <text class="dg__t" x="174" y="46" text-anchor="middle">Chat, DM,</text>
  <text class="dg__t" x="174" y="60" text-anchor="middle">voice note</text>

  <!-- the decision this system is known for: sandbox-first, so nothing waits
       on a Meta or Twilio approval -->
  <rect class="dg__box dg__box--sig" x="264" y="24" width="124" height="52"/>
  <text class="dg__t dg__t--sig" x="326" y="46" text-anchor="middle">Sandbox</text>
  <text class="dg__t dg__t--sig" x="326" y="60" text-anchor="middle">adapters</text>

  <rect class="dg__box" x="416" y="24" width="124" height="52"/>
  <text class="dg__t" x="478" y="53" text-anchor="middle">Unified inbox</text>

  <rect class="dg__box" x="416" y="124" width="124" height="52"/>
  <text class="dg__t" x="478" y="146" text-anchor="middle">Intent, RAG,</text>
  <text class="dg__t" x="478" y="160" text-anchor="middle">sentiment</text>

  <rect class="dg__box" x="568" y="124" width="124" height="52"/>
  <text class="dg__t" x="630" y="146" text-anchor="middle">Arabic reply</text>
  <text class="dg__t" x="630" y="160" text-anchor="middle">or ticket</text>

  <path class="dg__line" d="M236,50 H259"/><path class="dg__head" d="M264,50 L259,47 L259,53 Z"/>
  <path class="dg__line" d="M388,50 H411"/><path class="dg__head" d="M416,50 L411,47 L411,53 Z"/>
  <path class="dg__line" d="M478,76 V150 H411" transform="translate(0,0)"/>
  <path class="dg__line" d="M478,76 V124"/><path class="dg__head" d="M478,124 L475,119 L481,119 Z"/>
  <path class="dg__line" d="M540,150 H563"/><path class="dg__head" d="M568,150 L563,147 L563,153 Z"/>
</g></svg>
