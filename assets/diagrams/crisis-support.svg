<svg xmlns="http://www.w3.org/2000/svg" class="dg dg--lane" viewBox="0 0 720 250" role="img" aria-label="An incident passes an eligibility gate into a state machine, which branches to a calibrated score or to a deterministic fallback." focusable="false"><style>
  .dg__box  { fill: none; stroke: #D2CFC7; stroke-width: 1; }
  .dg__box--sig { stroke: #0B6B53; stroke-width: 1.5; }
  .dg__line { fill: none; stroke: #D2CFC7; stroke-width: 1; }
  .dg__head { fill: #D2CFC7; stroke: none; }
  .dg__t    { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; fill: #4A4F57; }
  .dg__t--sig { fill: #0B6B53; }
  .dg__lane { fill: #565C66; font-size: 10px; }
</style><g class="dg__flow"><text class="dg__t dg__lane" x="52" y="50" text-anchor="middle">Intake</text><text class="dg__t dg__lane" x="52" y="126" text-anchor="middle">Scored path</text><text class="dg__t dg__lane" x="52" y="202" text-anchor="middle">Degraded path</text><rect class="dg__box" x="112" y="24" width="124" height="52"/><text class="dg__t" x="174" y="54.0" text-anchor="middle">Incident</text><rect class="dg__box dg__box--sig" x="264" y="24" width="124" height="52"/><text class="dg__t dg__t--sig" x="326" y="47.0" text-anchor="middle">Eligibility</text><text class="dg__t dg__t--sig" x="326" y="61.0" text-anchor="middle">gate</text><rect class="dg__box" x="416" y="24" width="124" height="52"/><text class="dg__t" x="478" y="47.0" text-anchor="middle">State</text><text class="dg__t" x="478" y="61.0" text-anchor="middle">machine</text><rect class="dg__box" x="568" y="100" width="124" height="52"/><text class="dg__t" x="630" y="123.0" text-anchor="middle">Calibrated</text><text class="dg__t" x="630" y="137.0" text-anchor="middle">score</text><rect class="dg__box" x="568" y="176" width="124" height="52"/><text class="dg__t" x="630" y="206.0" text-anchor="middle">Fallback</text><path class="dg__line" d="M236,50 H259"/><path class="dg__head" d="M264,50 L259,47 L259,53 Z"/><path class="dg__line" d="M388,50 H411"/><path class="dg__head" d="M416,50 L411,47 L411,53 Z"/><path class="dg__line" d="M540,50 H554 V126 H563"/><path class="dg__head" d="M568,126 L563,123 L563,129 Z"/><path class="dg__line" d="M540,50 H554 V202 H563"/><path class="dg__head" d="M568,202 L563,199 L563,205 Z"/></g></svg>