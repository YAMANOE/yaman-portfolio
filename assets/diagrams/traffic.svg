<svg xmlns="http://www.w3.org/2000/svg" class="dg dg--lane" viewBox="0 0 720 200" role="img" aria-label="Road data flows through an invariant gate into a routing graph. Below it, video flows through tiled inference into tracking. Both feed a serving API." focusable="false"><style>
  .dg__box  { fill: none; stroke: #D2CFC7; stroke-width: 1; }
  .dg__box--sig { stroke: #0B6B53; stroke-width: 1.5; }
  .dg__line { fill: none; stroke: #D2CFC7; stroke-width: 1; }
  .dg__head { fill: #D2CFC7; stroke: none; }
  .dg__t    { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; fill: #4A4F57; }
  .dg__t--sig { fill: #0B6B53; }
  .dg__lane { fill: #565C66; font-size: 10px; }
</style><g class="dg__flow"><text class="dg__t dg__lane" x="52" y="50" text-anchor="middle">Road network</text><text class="dg__t dg__lane" x="52" y="150" text-anchor="middle">Vision</text><rect class="dg__box" x="112" y="24" width="124" height="52"/><text class="dg__t" x="174" y="54.0" text-anchor="middle">Road data</text><rect class="dg__box dg__box--sig" x="264" y="24" width="124" height="52"/><text class="dg__t dg__t--sig" x="326" y="47.0" text-anchor="middle">Invariant</text><text class="dg__t dg__t--sig" x="326" y="61.0" text-anchor="middle">gate</text><rect class="dg__box" x="416" y="24" width="124" height="52"/><text class="dg__t" x="478" y="47.0" text-anchor="middle">Routing</text><text class="dg__t" x="478" y="61.0" text-anchor="middle">graph</text><rect class="dg__box" x="112" y="124" width="124" height="52"/><text class="dg__t" x="174" y="154.0" text-anchor="middle">Video</text><rect class="dg__box" x="264" y="124" width="124" height="52"/><text class="dg__t" x="326" y="147.0" text-anchor="middle">Tiled</text><text class="dg__t" x="326" y="161.0" text-anchor="middle">inference</text><rect class="dg__box" x="416" y="124" width="124" height="52"/><text class="dg__t" x="478" y="154.0" text-anchor="middle">Tracking</text><rect class="dg__box" x="568" y="74" width="124" height="52"/><text class="dg__t" x="630" y="97.0" text-anchor="middle">Serving</text><text class="dg__t" x="630" y="111.0" text-anchor="middle">API</text><path class="dg__line" d="M236,50 H259"/><path class="dg__head" d="M264,50 L259,47 L259,53 Z"/><path class="dg__line" d="M388,50 H411"/><path class="dg__head" d="M416,50 L411,47 L411,53 Z"/><path class="dg__line" d="M236,150 H259"/><path class="dg__head" d="M264,150 L259,147 L259,153 Z"/><path class="dg__line" d="M388,150 H411"/><path class="dg__head" d="M416,150 L411,147 L411,153 Z"/><path class="dg__line" d="M540,50 H554 V100 H563"/><path class="dg__head" d="M568,100 L563,97 L563,103 Z"/><path class="dg__line" d="M540,150 H554 V100 H563"/><path class="dg__head" d="M568,100 L563,97 L563,103 Z"/></g></svg>